<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EB" />
  <title>Atelier · Gestión de marcas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Selector de marca (siempre visible) -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">Atelier</div>
      <nav class="brand-selector" id="brandSelector" aria-label="Seleccionar marca"></nav>
    </div>
  </header>

  <main class="main" id="mainView"></main>

  <!-- Navegación inferior -->
  <nav class="bottomnav" aria-label="Secciones">
    <button class="bottomnav-btn" data-view="panel" id="navPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Panel</span>
    </button>
    <button class="bottomnav-btn" data-view="contenido" id="navContenido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4M16 2v4"/></svg>
      <span>Contenido</span>
    </button>
  </nav>

  <!-- Botón nuevo contenido -->
  <button class="fab" id="fabNew" aria-label="Nuevo contenido">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Modal editor de contenido -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Nuevo contenido</h2>
        <button class="icon-btn" id="modalClose" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form id="contentForm" class="modal-body">
        <input type="hidden" id="fId" />

        <label class="field">
          <span class="field-label">Marca</span>
          <div class="brand-radio" id="fBrand"></div>
        </label>

        <label class="field">
          <span class="field-label">Título / Idea</span>
          <input type="text" id="fTitle" placeholder="Ej.: 3 señales de que necesitás plantillas" required />
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Fecha programada</span>
            <input type="date" id="fDate" />
          </label>
          <label class="field">
            <span class="field-label">Formato</span>
            <select id="fFormat"></select>
          </label>
        </div>

        <label class="field">
          <span class="field-label">Pilar de contenido</span>
          <select id="fPillar"></select>
        </label>

        <label class="field">
          <span class="field-label">Estado</span>
          <div class="state-radio" id="fState"></div>
        </label>

        <label class="field">
          <span class="field-label">Copy</span>
          <textarea id="fCopy" rows="4" placeholder="El texto del post…"></textarea>
        </label>

        <label class="field">
          <span class="field-label">Notas</span>
          <textarea id="fNotes" rows="2" placeholder="Referencias, feedback del cliente, hashtags…"></textarea>
        </label>

        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="btnDelete" hidden>Eliminar</button>
          <button type="submit" class="btn btn-primary" id="btnSave">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
